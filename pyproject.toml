[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-buddy"
version = "0.2.0"
description = "Secure local MCP proxy with cross-platform OAuth credential storage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
  "PyYAML>=6",
  "starlette>=0.40",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
build = ["pyinstaller>=6"]

[project.scripts]
mcp-buddy = "mcp_buddy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
