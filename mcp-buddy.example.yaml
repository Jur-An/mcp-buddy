servers:
  fcm:
    url: https://fcm.example.com/mcp
    transport: streamable-http
    auth:
      type: oauth-pkce
      credential_profile: fcm-prod
      account: axxju
      # Omit client_id to use Dynamic Client Registration. Alternatively,
      # provide a pre-registered public client ID here.
      # Pinning the issuer is recommended and required if the resource advertises several.
      issuer: https://login.example.com
      registration_url: https://login.example.com/oauth/register
      scopes:
        - mcp
        # Include only when the authorization server supports/needs it for refresh tokens.
        - offline_access
      resource: https://fcm.example.com/mcp

  local-tools:
    transport: stdio
    command:
      - python
      - -m
      - local_tools_mcp
    auth:
      type: none
